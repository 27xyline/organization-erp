services:
  postgres:
    image: postgres:15
    container_name: mc-accounting-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: mc_accounting
      POSTGRES_PASSWORD: mc_accounting_dev
      POSTGRES_DB: mc_accounting
    volumes:
      - mc_accounting_postgres_data:/var/lib/postgresql/data

volumes:
  mc_accounting_postgres_data:
