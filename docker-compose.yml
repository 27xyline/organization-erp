services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-project1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-project1}
    volumes:
      - project1_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && python -m app.scripts.verify_schema",
      ]
    environment:
      BACKEND_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-project1}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-project1}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-project1}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-project1}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://backend:8000}
      BACKEND_BRIDGE_SECRET: ${BACKEND_BRIDGE_SECRET:-}
      BACKEND_INTERNAL_AUTH_SECRET: ${BACKEND_INTERNAL_AUTH_SECRET:-}
      BACKEND_CSRF_SECRET: ${BACKEND_CSRF_SECRET:-}
      BACKEND_PUBLIC_ORIGIN: ${BACKEND_PUBLIC_ORIGIN:-${NEXTAUTH_URL:-http://localhost:3001}}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
      DOCUMENT_STORAGE_ROOT: /var/lib/project1/documents
      DOCUMENT_MAX_FILE_SIZE_BYTES: ${DOCUMENT_MAX_FILE_SIZE_BYTES:-26214400}
      PORT: 3001
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: erp-app
    volumes:
      - project1_document_data:/var/lib/project1/documents
    networks:
      - default
      - observability_ingest
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_DATABASE_URL: ${BACKEND_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-project1}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-project1}}
      BACKEND_ENVIRONMENT: ${BACKEND_ENVIRONMENT:-development}
      BACKEND_BRIDGE_SECRET: ${BACKEND_BRIDGE_SECRET:-}
      BACKEND_INTERNAL_AUTH_SECRET: ${BACKEND_INTERNAL_AUTH_SECRET:-}
      BACKEND_CSRF_SECRET: ${BACKEND_CSRF_SECRET:-}
      BACKEND_PUBLIC_ORIGIN: ${BACKEND_PUBLIC_ORIGIN:-${NEXTAUTH_URL:-http://localhost:3001}}
      DOCUMENT_STORAGE_ROOT: /var/lib/project1/documents
      DOCUMENT_MAX_FILE_SIZE_BYTES: ${DOCUMENT_MAX_FILE_SIZE_BYTES:-26214400}
      BACKEND_OTEL_ENABLED: ${BACKEND_OTEL_ENABLED:-true}
      BACKEND_OTEL_EXPORTER_OTLP_ENDPOINT: ${BACKEND_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      BACKEND_SERVICE_NAME: organization-erp-backend
    networks:
      - default
      - observability_ingest
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - project1_document_data:/var/lib/project1/documents
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.tasks.notifications"]
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      BACKEND_DATABASE_URL: ${BACKEND_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-project1}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-project1}}
      BACKEND_ENVIRONMENT: ${BACKEND_ENVIRONMENT:-development}
      BACKEND_OTEL_ENABLED: ${BACKEND_OTEL_ENABLED:-true}
      BACKEND_OTEL_EXPORTER_OTLP_ENDPOINT: ${BACKEND_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      BACKEND_SERVICE_NAME: organization-erp-notification-worker
    networks:
      - default
      - observability_ingest
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if b'app.tasks.notifications' in open('/proc/1/cmdline', 'rb').read() else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    profiles: [observability]
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./ops/observability/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - observability_ingest
      - observability_backend

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [observability]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - project1_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - default
      - observability_backend

  tempo:
    image: grafana/tempo:2.7.1
    profiles: [observability]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./ops/observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - project1_tempo_data:/var/tempo
    networks:
      - observability_backend

  grafana:
    image: grafana/grafana:11.5.2
    profiles: [observability]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - project1_grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    networks:
      - default
      - observability_backend

volumes:
  project1_postgres_data:
  project1_document_data:
  project1_prometheus_data:
  project1_tempo_data:
  project1_grafana_data:

networks:
  observability_ingest:
    internal: true
  observability_backend:
    internal: true
