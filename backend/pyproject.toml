[project]
name = "organization-erp-backend"
version = "0.1.0"
description = "Python backend foundation for Organization ERP"
requires-python = ">=3.13,<3.15"
dependencies = [
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "openpyxl>=3.1.5,<4",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "pydantic-settings>=2.5.0",
    "pyjwt>=2.10.1",
    "python-docx>=1.1.2,<2",
    "python-multipart>=0.0.20,<1",
    "qrcode>=8.0,<9",
    "reportlab>=4.2,<5",
    "sqlalchemy[asyncio]>=2.0.35",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "anyio>=4.6.2",
    "httpx>=0.27.2",
    "mypy>=1.13.0",
    "pypdf>=5.0,<7",
    "pytest>=8.3.3",
    "ruff>=0.7.1",
    "types-openpyxl>=3.1.5,<4",
    "types-reportlab>=4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
